<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>제주지방기상청 방탈출 게임</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ① 난이도 선택 화면 -->
  <section id="difficulty-screen" class="screen">
    <div class="screen-inner difficulty-inner">
      <h1 class="app-title">제주지방기상청<br />탐험 방탈출</h1>
      <p class="app-subtitle">난이도를 선택해 주세요</p>
      <div class="difficulty-buttons">
        <button type="button" class="difficulty-btn" data-difficulty="elementary">
          <span class="difficulty-emoji">🌤️</span>
          <span>초등학생</span>
        </button>
        <button type="button" class="difficulty-btn" data-difficulty="secondary">
          <span class="difficulty-emoji">🌪️</span>
          <span>중고등학생</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ② 지도 화면 -->
  <section id="map-screen" class="screen" hidden>
    <header class="map-header">
      <h2>제주지방기상청 탐험 지도</h2>
      <p class="map-hint">QR 코드를 스캔하거나 마커를 눌러 미션을 시작하세요</p>
    </header>

    <div class="map-type-toggle" role="tablist">
      <button type="button" class="map-type-btn" data-map-type="indoor">🏛️ 실내 홍보관</button>
      <button type="button" class="map-type-btn" data-map-type="outdoor">🌳 실외 탐방로</button>
    </div>

    <div id="map-container" class="map-container">
      <!-- 지도 배경 이미지: main.js가 mapType에 따라 src를 교체함 -->
      <img id="map-bg-img" src="" alt="지도 배경" class="map-bg" />
      <!-- map.js가 이 안에 마커(button.map-marker)를 동적으로 렌더링 -->
    </div>
  </section>

  <!-- ③ 미션 화면 (모달형) -->
  <section id="mission-screen" class="screen mission-screen" hidden>
    <div class="mission-panel">
      <header class="mission-header">
        <h2 class="mission-location-name">거점 이름</h2>
        <button type="button" class="mission-close-btn" aria-label="닫기">✕</button>
      </header>
      <div class="mission-body">
        <!-- missionLoader.js가 이 안에 문제 UI를 렌더링 -->
      </div>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
